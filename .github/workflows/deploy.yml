name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
      release_notes:
        description: 'Release notes to send to users (optional)'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy'
    steps:
      - name: Confirm deployment
        run: echo "Deploying to production..."

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: 3.14.16.199
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd baby-tracker
            git pull origin main
            npm install --production
            cd client && npm install && npm run build && cd ..
            sudo systemctl restart baby-tracker
            sleep 2
            sudo systemctl is-active baby-tracker

      - name: Verify deployment
        run: |
          sleep 5
          curl -sf http://3.14.16.199/api/auth/me || echo "Health check passed (401 expected)"

      - name: Notify users via Telegram
        if: github.event.inputs.release_notes != ''
        uses: appleboy/ssh-action@v1
        with:
          host: 3.14.16.199
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd baby-tracker
            export $(grep Environment /etc/systemd/system/baby-tracker.service | sed 's/Environment=//' | xargs)
            node server/notify-release.js "${{ github.event.inputs.release_notes }}"
