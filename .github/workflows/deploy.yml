name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: 3.14.16.199
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd baby-tracker
            git pull origin main
            npm install --production
            cd client && npm install && npm run build && cd ..
            sudo systemctl restart baby-tracker
