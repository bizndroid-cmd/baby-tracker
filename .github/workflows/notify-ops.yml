name: Ops Notifications (Telegram)

on:
  pull_request:
    types: [opened, closed, reopened]
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: PR Opened
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.OPS_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.OPS_CHAT_ID }} \
            -d parse_mode=Markdown \
            -d text="🔀 *New PR Opened*%0A%0ATitle: ${{ github.event.pull_request.title }}%0ABy: ${{ github.event.pull_request.user.login }}%0ABranch: \`${{ github.event.pull_request.head.ref }}\` → \`main\`%0A%0A🔗 ${{ github.event.pull_request.html_url }}"

      - name: PR Merged
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.OPS_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.OPS_CHAT_ID }} \
            -d parse_mode=Markdown \
            -d text="✅ *PR Merged*%0A%0ATitle: ${{ github.event.pull_request.title }}%0ABy: ${{ github.event.pull_request.user.login }}%0ABranch: \`${{ github.event.pull_request.head.ref }}\`%0A%0A🔗 ${{ github.event.pull_request.html_url }}"

      - name: Push to Main
        if: github.event_name == 'push'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.OPS_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.OPS_CHAT_ID }} \
            -d parse_mode=Markdown \
            -d text="📦 *Push to Main*%0A%0ACommit: ${{ github.event.head_commit.message }}%0ABy: ${{ github.event.head_commit.author.name }}%0A%0A🔗 ${{ github.event.head_commit.url }}"
